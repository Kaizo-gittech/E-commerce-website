<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shopping Cart — VloMa</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Jost:wght@300;400;500;600&display=swap"
        rel="stylesheet"
    >

    <style>

        :root {
            --maroon: #2F2F2F;
            --maroon-dark: #1A1A1A;
            --gold: #B08D57;
            --gold-light: #D4C2A1;
            --ink: #222222;
            --ink-soft: #6D6D6D;
            --bg: #FFFFFF;
            --bg-soft: #F6F6F5;
            --border: #E8E8E8;
            --danger: #D14343;

            --radius: 3px;

            --serif: 'Playfair Display', Georgia, serif;
            --sans: 'Jost', -apple-system, BlinkMacSystemFont,
                     'Segoe UI', Arial, sans-serif;
        }

        body.dark-mode {
            --maroon: #D4C2A1;
            --maroon-dark: #B08D57;
            --gold: #D4C2A1;
            --gold-light: #E8DCC4;
            --ink: #EDEDED;
            --ink-soft: #A8A8A8;
            --bg: #161616;
            --bg-soft: #212121;
            --border: #333333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--sans);
            color: var(--ink);
            background: var(--bg);
            line-height: 1.6;
            transition: background .2s, color .2s;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        /* ================= NAVBAR ================= */

        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;

            padding: 18px 44px;

            border-bottom: 1px solid var(--border);

            background: var(--bg);

            position: sticky;
            top: 0;

            z-index: 200;
        }

        .nav-left {
            display: flex;
            align-items: center;
        }

        .nav-logo {
            font-family: var(--serif);
            font-size: 26px;
            font-weight: 700;

            color: var(--maroon);

            letter-spacing: .5px;
        }

        .nav-logo small {
            display: block;

            font-family: var(--sans);

            font-size: 9px;
            letter-spacing: 3px;

            color: var(--gold);

            font-weight: 500;
            margin-top: 2px;
        }

        .nav-links {
            display: flex;
            gap: 34px;
            flex: 1;
            justify-content: center;
        }

        .nav-item > a {
            font-size: 12.5px;
            letter-spacing: 1px;

            font-weight: 600;

            text-transform: uppercase;

            padding: 12px 2px;

            display: block;

            color: var(--ink);

            border-bottom: 1px solid transparent;
        }

        .nav-item > a:hover {
            color: var(--maroon);
            border-color: var(--gold);
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 22px;
        }

        .nav-icon-btn {
            display: flex;
            align-items: center;

            position: relative;

            color: var(--ink);

            cursor: pointer;
        }

        .nav-icon-btn svg {
            width: 19px;
            height: 19px;

            stroke: currentColor;

            stroke-width: 1.5;

            fill: none;
        }

        .nav-icon-btn:hover {
            color: var(--maroon);
        }

        .cart-count {
            position: absolute;

            top: -7px;
            right: -9px;

            background: var(--maroon);
            color: #fff;

            font-size: 9.5px;

            width: 16px;
            height: 16px;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ================= PAGE ================= */

        .main {
            max-width: 1140px;

            margin: 0 auto;

            padding: 40px 44px;
        }

        .page-head {
            display: flex;

            justify-content: space-between;
            align-items: flex-start;

            border-bottom: 1px solid var(--border);

            padding-bottom: 20px;

            margin-bottom: 30px;
        }

        .page-head h1 {
            font-family: var(--serif);

            font-size: 30px;

            font-weight: 600;

            color: var(--maroon);

            margin-bottom: 6px;
        }

        .page-head p {
            font-size: 13.5px;
            color: var(--ink-soft);
        }

        /* ================= CART ================= */

        .cart-layout {
            display: grid;

            grid-template-columns: 1fr 340px;

            gap: 26px;

            align-items: start;
        }

        .card {
            border: 1px solid var(--border);

            border-radius: var(--radius);

            background: var(--bg);

            padding: 24px;
        }

        .card-title {
            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 18px;
        }

        .card-title h2,
        .card-title h3 {
            font-family: var(--serif);

            font-size: 18px;

            font-weight: 600;

            color: var(--maroon);
        }

        .item-count {
            font-size: 12px;

            color: var(--ink-soft);

            letter-spacing: .5px;
        }

        /* ================= CART ITEM ================= */

        .cart-item {
            display: flex;

            align-items: center;

            gap: 18px;

            padding: 18px 0;

            border-bottom: 1px solid var(--border);
        }

        .cart-item:last-child {
            border-bottom: none;
        }

        .cart-image {
            width: 90px;
            height: 110px;

            object-fit: cover;

            border-radius: var(--radius);

            background: var(--bg-soft);

            flex-shrink: 0;
        }

        .item-info {
            flex: 1;
        }

        .item-info h3 {
            font-family: var(--serif);

            font-size: 15px;

            font-weight: 600;

            margin-bottom: 5px;

            color: var(--ink);
        }

        .price {
            color: var(--maroon);

            font-size: 14px;

            font-weight: 600;

            margin-bottom: 12px;
        }

        /* ================= QUANTITY ================= */

        .quantity {
            display: flex;

            align-items: center;

            gap: 10px;
        }

        .quantity button {
            width: 30px;
            height: 30px;

            border: 1px solid var(--border);

            background: var(--bg);

            color: var(--ink);

            cursor: pointer;

            border-radius: 2px;

            font-size: 16px;
        }

        .quantity button:hover {
            border-color: var(--gold);

            color: var(--maroon);
        }

        .quantity span {
            min-width: 22px;

            text-align: center;

            font-size: 13px;
        }

        /* ================= ITEM RIGHT ================= */

        .item-right {
            text-align: right;

            min-width: 110px;
        }

        .item-total {
            font-size: 14px;

            font-weight: 600;

            color: var(--ink);

            margin-bottom: 10px;
        }

        .remove-btn {
            border: none;

            background: transparent;

            color: var(--danger);

            font-family: var(--sans);

            font-size: 11px;

            text-transform: uppercase;

            letter-spacing: .5px;

            cursor: pointer;
        }

        .remove-btn:hover {
            text-decoration: underline;
        }

        /* ================= SUMMARY ================= */

        .summary {
            position: sticky;

            top: 110px;
        }

        .summary-row {
            display: flex;

            justify-content: space-between;

            align-items: center;

            padding: 11px 0;

            font-size: 13.5px;

            color: var(--ink-soft);
        }

        .summary-row span:last-child {
            color: var(--ink);

            font-weight: 500;
        }

        .total {
            border-top: 1px solid var(--border);

            margin-top: 8px;

            padding-top: 18px;

            font-size: 16px;

            color: var(--ink);
        }

        .total span:last-child {
            color: var(--maroon);

            font-size: 18px;

            font-weight: 700;
        }

        .checkout-btn {
            width: 100%;

            margin-top: 22px;

            padding: 13px 20px;

            border: 1px solid var(--maroon);

            border-radius: 2px;

            background: var(--maroon);

            color: #fff;

            cursor: pointer;

            font-family: var(--sans);

            font-size: 12px;

            font-weight: 600;

            letter-spacing: .8px;

            text-transform: uppercase;
        }

        .checkout-btn:hover {
            background: var(--maroon-dark);

            border-color: var(--maroon-dark);
        }

        /* ================= EMPTY CART ================= */

        .empty-cart {
            text-align: center;

            padding: 70px 20px;

            color: var(--ink-soft);
        }

        .empty-cart h2 {
            font-family: var(--serif);

            color: var(--maroon);

            font-size: 22px;

            margin-bottom: 8px;
        }

        .empty-cart p {
            font-size: 13px;
        }

        /* ================= FOOTER ================= */

        footer {
            background: var(--maroon-dark);

            color: #f1e6da;

            margin-top: 40px;

            padding: 40px 44px 22px;
        }

        footer h2 {
            font-family: var(--serif);

            font-size: 22px;

            color: #fff;

            margin-bottom: 14px;
        }

        footer div span {
            display: block;

            font-size: 13.5px;

            color: #d9c6b8;

            margin-bottom: 8px;

            cursor: pointer;
        }

        footer div span:hover {
            color: var(--gold-light);
        }

        /* ================= DARK MODE ================= */

        body.dark-mode .navbar,
        body.dark-mode .card {
            background: var(--bg);
        }

        /* ================= RESPONSIVE ================= */

        @media (max-width: 900px) {

            .navbar {
                padding: 14px 20px;
            }

            .nav-links {
                display: none;
            }

            .main {
                padding: 30px 20px;
            }

            .cart-layout {
                grid-template-columns: 1fr;
            }

            .summary {
                position: static;
            }
        }

        @media (max-width: 600px) {

            .page-head {
                flex-direction: column;
            }

            .cart-item {
                align-items: flex-start;
            }

            .cart-image {
                width: 75px;
                height: 90px;
            }

            .item-right {
                min-width: auto;
            }

            .main {
                padding: 25px 15px;
            }

            .card {
                padding: 18px;
            }

            footer {
                padding: 35px 20px 20px;
            }
        }

    </style>
</head>

<body>

<header class="navbar">

    <div class="nav-left">

        <a href="{{ url_for('index') }}" class="nav-logo">
            VloMa
            <small>THE WOMEN'S</small>
        </a>

    </div>

    <nav class="nav-links">

        <div class="nav-item">
            <a href="{{ url_for('shop') }}">Shop</a>
        </div>

        <div class="nav-item">
            <a href="{{ url_for('shop', cat='jewellery') }}">
                Jewellery
            </a>
        </div>

        <div class="nav-item">
            <a href="{{ url_for('shop', cat='clothing') }}">
                Clothing
            </a>
        </div>

        <div class="nav-item">
            <a href="{{ url_for('shop', cat='footwear') }}">
                Footwear
            </a>
        </div>

        <div class="nav-item">
            <a href="{{ url_for('shop', cat='perfume') }}">
                Perfume
            </a>
        </div>

        <div class="nav-item">
            <a href="{{ url_for('shop', sort='new') }}">
                New Arrivals
            </a>
        </div>

    </nav>

    <div class="nav-right">

        <a
            class="nav-icon-btn"
            href="{{ url_for('account') }}"
            title="Account"
        >
            <svg viewBox="0 0 24 24">
                <circle cx="12" cy="8" r="4"/>
                <path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>
            </svg>
        </a>

        <a
            class="nav-icon-btn"
            href="{{ url_for('shop') }}"
            title="Wishlist"
        >
            <svg viewBox="0 0 24 24">
                <path d="M20.8 4.6a5 5 0 0 0-7.1 0L12 6.3l-1.7-1.7a5 5 0 0 0-7.1 7.1L12 20.3l8.8-8.6a5 5 0 0 0 0-7.1z"/>
            </svg>
        </a>

        <a
            class="nav-icon-btn"
            href="{{ url_for('cart') }}"
            title="Cart"
        >
            <svg viewBox="0 0 24 24">
                <path d="M6 2l1.5 5h9L18 2"/>
                <path d="M3.5 7h17l-1.5 13h-14z"/>
            </svg>

            <span class="cart-count" id="cartCount">0</span>
        </a>

    </div>

</header>


<main class="main">

    <div class="page-head">

        <div>

            <h1>Shopping Cart</h1>

            <p>
                Review your selected items before checkout.
            </p>

        </div>

    </div>


    <div class="cart-layout">

        <!-- CART -->

        <div class="card">

            <div class="card-title">

                <h2>Your Items</h2>

                <span
                    class="item-count"
                    id="itemCount"
                >
                    0 items
                </span>

            </div>

            <div id="cartItems"></div>

        </div>


        <!-- SUMMARY -->

        <div class="card summary">

            <div class="card-title">

                <h2>Order Summary</h2>

            </div>

            <div class="summary-row">

                <span>Subtotal</span>

                <span id="subtotal">₹0</span>

            </div>

            <div class="summary-row">

                <span>Delivery</span>

                <span id="delivery">₹0</span>

            </div>

            <div class="summary-row total">

                <span>Total</span>

                <span id="total">₹0</span>

            </div>

            <button
                class="checkout-btn"
                onclick="goToCheckout()"
            >
                Proceed to Checkout
            </button>

        </div>

    </div>

</main>


<footer>

    <h2>VloMa</h2>

    <div>
        <span>Newsletter</span>
        <span>Support</span>
    </div>

</footer>


<script>

function getCart() {

    return JSON.parse(
        localStorage.getItem("anistock_cart") || "[]"
    );

}


function saveCart(cart) {

    localStorage.setItem(
        "anistock_cart",
        JSON.stringify(cart)
    );

}


function money(value) {

    return "₹" +
        Number(value).toLocaleString("en-IN");

}


function updateCartCount() {

    const cart = getCart();

    const count = cart.reduce(
        (total, item) =>
            total + Number(item.qty || 0),
        0
    );

    const element =
        document.getElementById("cartCount");

    if (element) {
        element.textContent = count;
    }

}


function renderCart() {

    const cart = getCart();

    const container =
        document.getElementById("cartItems");

    container.innerHTML = "";

    const itemCount =
        document.getElementById("itemCount");

    const totalItems = cart.reduce(
        (total, item) =>
            total + Number(item.qty || 0),
        0
    );

    itemCount.textContent =
        `${totalItems} ${totalItems === 1 ? "item" : "items"}`;


    if (cart.length === 0) {

        container.innerHTML = `

            <div class="empty-cart">

                <h2>Your cart is empty</h2>

                <p>
                    Add some products to your cart.
                </p>

            </div>

        `;

        document.getElementById("subtotal")
            .textContent = "₹0";

        document.getElementById("delivery")
            .textContent = "₹0";

        document.getElementById("total")
            .textContent = "₹0";

        updateCartCount();

        return;
    }


    let subtotal = 0;


    cart.forEach((item, index) => {

        const price = Number(item.price || 0);

        const qty = Number(item.qty || 0);

        subtotal += price * qty;


        container.innerHTML += `

            <div class="cart-item">

                <img
                    class="cart-image"
                    src="${item.img || ''}"
                    alt="${item.name || 'Product'}"
                    onerror="this.style.display='none'"
                >

                <div class="item-info">

                    <h3>
                        ${item.name || "Product"}
                    </h3>

                    <div class="price">
                        ${money(price)}
                    </div>

                    <div class="quantity">

                        <button
                            onclick="changeQuantity(${index}, -1)"
                        >
                            −
                        </button>

                        <span>
                            ${qty}
                        </span>

                        <button
                            onclick="changeQuantity(${index}, 1)"
                        >
                            +
                        </button>

                    </div>

                </div>


                <div class="item-right">

                    <div class="item-total">
                        ${money(price * qty)}
                    </div>

                    <button
                        class="remove-btn"
                        onclick="removeItem(${index})"
                    >
                        Remove
                    </button>

                </div>

            </div>

        `;

    });


    const delivery =
        subtotal >= 1000 ? 0 : 100;

    const total =
        subtotal + delivery;


    document.getElementById("subtotal")
        .textContent = money(subtotal);

    document.getElementById("delivery")
        .textContent =
            delivery === 0
                ? "FREE"
                : money(delivery);

    document.getElementById("total")
        .textContent = money(total);

    updateCartCount();

}


function changeQuantity(index, change) {

    const cart = getCart();

    cart[index].qty =
        Number(cart[index].qty) + change;


    if (cart[index].qty <= 0) {

        cart.splice(index, 1);

    }


    saveCart(cart);

    renderCart();

}


function removeItem(index) {

    const cart = getCart();

    cart.splice(index, 1);

    saveCart(cart);

    renderCart();

}


function goToCheckout() {

    const cart = getCart();

    if (cart.length === 0) {

        alert("Your cart is empty.");

        return;

    }

    window.location.href =
        "{{ url_for('checkout') }}";

}


renderCart();

</script>


</body>
</html>
