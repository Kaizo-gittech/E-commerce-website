<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shopping Cart</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f6f6f6;
            color: #222;
        }

        .container {
            max-width: 1100px;
            margin: 50px auto;
            padding: 20px;
        }

        h1 {
            margin-bottom: 25px;
        }

        .cart-layout {
            display: grid;
            grid-template-columns: 1fr 330px;
            gap: 25px;
        }

        .cart-items {
            background: white;
            border-radius: 10px;
            padding: 20px;
        }

        .cart-item {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 20px 0;
            border-bottom: 1px solid #ddd;
        }

        .cart-item:last-child {
            border-bottom: none;
        }

        .cart-image {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 8px;
            background: #eee;
        }

        .item-info {
            flex: 1;
        }

        .item-info h3 {
            margin-bottom: 8px;
        }

        .price {
            font-weight: bold;
            margin-bottom: 12px;
        }

        .quantity {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .quantity button {
            width: 30px;
            height: 30px;
            border: 1px solid #ccc;
            background: white;
            cursor: pointer;
            border-radius: 5px;
        }

        .remove-btn {
            border: none;
            background: #dc3545;
            color: white;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
        }

        .summary {
            background: white;
            border-radius: 10px;
            padding: 25px;
            height: fit-content;
        }

        .summary h2 {
            margin-bottom: 20px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
        }

        .total {
            border-top: 1px solid #ddd;
            padding-top: 15px;
            font-size: 20px;
            font-weight: bold;
        }

        .checkout-btn {
            width: 100%;
            margin-top: 20px;
            padding: 14px;
            border: none;
            border-radius: 6px;
            background: #2f2f2f;
            color: white;
            cursor: pointer;
            font-size: 16px;
        }

        .checkout-btn:hover {
            background: #111;
        }

        .empty-cart {
            text-align: center;
            padding: 60px 20px;
            color: #777;
        }

        @media(max-width: 700px) {

            .cart-layout {
                grid-template-columns: 1fr;
            }

            .cart-item {
                flex-wrap: wrap;
            }

        }

    </style>
</head>

<body>

<div class="container">

    <h1>Shopping Cart</h1>

    <div class="cart-layout">

        <!-- CART ITEMS -->

        <div class="cart-items">

            <div id="cartItems"></div>

        </div>


        <!-- SUMMARY -->

        <div class="summary">

            <h2>Order Summary</h2>

            <div class="summary-row">
                <span>Subtotal</span>
                <span id="subtotal">₹0</span>
            </div>

            <div class="summary-row">
                <span>Delivery</span>
                <span id="delivery">₹0</span>
            </div>

            <div class="summary-row total">
                <span>Total</span>
                <span id="total">₹0</span>
            </div>

            <button
                class="checkout-btn"
                onclick="goToCheckout()"
            >
                Proceed to Checkout
            </button>

        </div>

    </div>

</div>


<script>

function getCart() {

    return JSON.parse(
        localStorage.getItem("anistock_cart") || "[]"
    );

}


function saveCart(cart) {

    localStorage.setItem(
        "anistock_cart",
        JSON.stringify(cart)
    );

}


function money(value) {

    return "₹" + Number(value).toLocaleString("en-IN");

}


function renderCart() {

    const cart = getCart();

    const container =
        document.getElementById("cartItems");

    container.innerHTML = "";

    if (cart.length === 0) {

        container.innerHTML = `
            <div class="empty-cart">

                <h2>Your cart is empty</h2>

                <p>Add some products to your cart.</p>

            </div>
        `;

        document.getElementById("subtotal").textContent =
            "₹0";

        document.getElementById("delivery").textContent =
            "₹0";

        document.getElementById("total").textContent =
            "₹0";

        return;

    }


    let subtotal = 0;


    cart.forEach((item, index) => {

        const price = Number(item.price);
        const qty = Number(item.qty);

        subtotal += price * qty;


        container.innerHTML += `

            <div class="cart-item">

                <img
                    class="cart-image"
                    src="${item.img || ''}"
                    alt="${item.name}"
                    onerror="this.style.display='none'"
                >

                <div class="item-info">

                    <h3>
                        ${item.name}
                    </h3>

                    <div class="price">
                        ${money(price)}
                    </div>

                    <div class="quantity">

                        <button
                            onclick="changeQuantity(${index}, -1)"
                        >
                            −
                        </button>

                        <span>
                            ${qty}
                        </span>

                        <button
                            onclick="changeQuantity(${index}, 1)"
                        >
                            +
                        </button>

                    </div>

                </div>

                <div>

                    <strong>
                        ${money(price * qty)}
                    </strong>

                    <br><br>

                    <button
                        class="remove-btn"
                        onclick="removeItem(${index})"
                    >
                        Remove
                    </button>

                </div>

            </div>

        `;

    });


    const delivery = subtotal >= 1000 ? 0 : 100;

    const total = subtotal + delivery;


    document.getElementById("subtotal").textContent =
        money(subtotal);

    document.getElementById("delivery").textContent =
        delivery === 0 ? "FREE" : money(delivery);

    document.getElementById("total").textContent =
        money(total);

}


function changeQuantity(index, change) {

    const cart = getCart();

    cart[index].qty =
        Number(cart[index].qty) + change;


    if (cart[index].qty <= 0) {

        cart.splice(index, 1);

    }


    saveCart(cart);

    renderCart();

}


function removeItem(index) {

    const cart = getCart();

    cart.splice(index, 1);

    saveCart(cart);

    renderCart();

}


function goToCheckout() {

    const cart = getCart();

    if (cart.length === 0) {

        alert("Your cart is empty.");

        return;

    }

    window.location.href =
        "{{ url_for('checkout') }}";

}


renderCart();

</script>

</body>
</html>
