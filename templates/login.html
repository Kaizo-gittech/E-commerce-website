<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome — Vloma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{
    --maroon:#2F2F2F;
    --maroon-dark:#1A1A1A;
    --gold:#B08D57;
    --gold-light:#D4C2A1;
    --ink:#222222;
    --ink-soft:#6D6D6D;
    --bg:#F6F6F5;
    --border:#E8E8E8;
    --error:#D14343;
    --serif:'Playfair Display', Georgia, 'Times New Roman', serif;
    --sans:'Jost', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
}


body.dark-mode{
    --maroon:#D4C2A1;
    --maroon-dark:#B08D57;
    --gold:#D4C2A1;
    --gold-light:#E8DCC4;
    --ink:#EDEDED;
    --ink-soft:#A8A8A8;
    --bg:#161616;
    --border:#333333;
}
body.dark-mode .card, body.dark-mode .form-side, body.dark-mode .settings-modal,
body.dark-mode .dots-btn, body.dark-mode .social-btn{ background:#1E1E1E; }

*{ box-sizing:border-box; margin:0; padding:0; }

body{
    font-family:var(--sans);
    color:var(--ink);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;

    background:
        linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,.45)),
        url("vloma-bg.jpg");

    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    background-attachment:fixed;
}

a{ color:var(--maroon); text-decoration:none; }

.settings-overlay{ display:none; position:fixed; inset:0; background:rgba(20,10,10,.55); z-index:900; align-items:center; justify-content:center; padding:20px; }
.settings-overlay.show{ display:flex; }
.settings-modal{ background:#fff; width:100%; max-width:480px; max-height:82vh; border-radius:10px; overflow:hidden; display:flex; flex-direction:column; }
.settings-modal-head{ display:flex; align-items:center; justify-content:space-between; padding:20px 24px; border-bottom:1px solid var(--border); }
.settings-modal-head h2{ font-family:var(--serif); font-size:19px; color:var(--maroon); }
.settings-close{ background:none; border:none; font-size:16px; cursor:pointer; color:var(--ink-soft); }
.settings-body{ overflow-y:auto; padding:8px 0; }
.settings-section{ border-bottom:1px solid var(--border); }
.settings-section-head{ display:flex; align-items:center; justify-content:space-between; padding:16px 24px; cursor:pointer; font-weight:600; font-size:14px; }
.settings-section-title{ display:flex; align-items:center; gap:12px; }
.settings-icon svg{ width:18px; height:18px; stroke:var(--maroon); fill:none; stroke-width:1.8; }
.settings-section-head .chev{ transition:transform .2s; color:var(--ink-soft); font-weight:400; }
.settings-section.open .settings-section-head .chev{ transform:rotate(180deg); }
.settings-section-items{ display:none; padding:0 26px 14px; }
.settings-section.open .settings-section-items{ display:block; }
.settings-item-row{ display:flex; justify-content:space-between; align-items:center; padding:10px 0; font-size:13.5px; color:var(--ink); cursor:pointer; border-top:1px solid var(--bg); }
.settings-item-row:first-child{ border-top:none; }
.settings-item-row:hover{ color:var(--maroon); }
.settings-item-row.settings-danger{ color:#D14343; }
.settings-item-row.settings-danger:hover{ color:#7d2323; }
.settings-chevron-small{ color:var(--ink-soft); font-size:14px; transition:transform .2s; }
.settings-chevron-small.rotated{ transform:rotate(180deg); }
.settings-subsection{ max-height:0; overflow:hidden; transition:max-height .25s ease; }
.settings-subsection.open{ max-height:400px; }
.settings-item-row.settings-subitem{ padding-left:18px; font-size:12.5px; color:var(--ink-soft); border-top:1px dashed var(--bg); }
.settings-item-row.settings-subitem:hover{ color:var(--maroon); }
.settings-toggle{ width:38px; height:22px; border-radius:12px; background:var(--border); position:relative; cursor:pointer; flex-shrink:0; }
.settings-toggle.on{ background:var(--maroon); }
.settings-toggle::after{ content:''; position:absolute; top:2px; left:2px; width:18px; height:18px; background:#fff; border-radius:50%; transition:left .2s; }
.settings-toggle.on::after{ left:18px; }

.card{ display:grid; grid-template-columns:1.1fr 0.9fr; max-width:1100px; width:100%; background:#fff; border:1px solid var(--border); border-radius:10px; overflow:hidden; box-shadow:0 20px 60px rgba(20,5,10,.35); }

.visual{ position:relative; background-image:url('vloma.png');
  padding:44px; display:flex; flex-direction:column; justify-content:space-between; color:#fff; min-height:460px; }.visual{
    position:relative;
    min-height:460px;
    padding:44px;

    display:flex;
    flex-direction:column;
    justify-content:space-between;

    color:#fff;

    background:
        linear-gradient(
            rgba(0,0,0,.35),
            rgba(0,0,0,.35)
        ),
        url("vloma.png");

    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;

    overflow:hidden;
}
.visual-top, .visual-bottom{ position:relative; z-index:1; }

.visual-top{ display:flex; justify-content:space-between; align-items:flex-start; }
.brand{ font-family:var(--serif); font-size:25px; font-weight:700; }
.brand small{ display:block; font-family:var(--sans); font-size:9px; letter-spacing:3px; opacity:.8; margin-top:3px; color:var(--gold-light); }
.sysver{ font-size:10px; opacity:.4; letter-spacing:1px; }

.visual-bottom{ border-left:3px solid var(--gold); padding-left:18px; }
.visual-bottom h2{ font-family:var(--serif); font-size:32px; font-weight:600; line-height:1.2; margin-bottom:12px; }
.visual-bottom p{ font-size:14px; opacity:.88; max-width:340px; line-height:1.7; }

.form-side{ padding:44px; display:flex; flex-direction:column; justify-content:center; background:#fff; }

.tabs{ display:flex; gap:30px; border-bottom:1px solid var(--border); margin-bottom:26px; }
.tab{ font-family:var(--serif); font-size:16px; font-weight:600; letter-spacing:.5px; padding-bottom:13px; cursor:pointer; color:var(--ink-soft); border-bottom:2px solid transparent; position:relative; top:1px; }
.tab.active{ color:var(--maroon); border-bottom-color:var(--gold); }

.field{ margin-bottom:18px; }
.field-label{ display:flex; justify-content:space-between; font-size:10.5px; letter-spacing:1px; color:var(--ink-soft); margin-bottom:8px; text-transform:uppercase; }
.field-label a{ font-size:11px; }

.input-wrap{ position:relative; display:flex; align-items:center; }
.input-wrap input{ width:100%; padding:12px 14px; border:1.5px solid var(--border); border-radius:4px; font-size:14px; outline:none; transition:border-color .15s; font-family:inherit; }
.input-wrap .pw-toggle{ position:absolute; right:14px; background:none; border:none; color:var(--ink-soft); cursor:pointer; font-size:14px; }
.input-wrap input:focus{ border-color:var(--maroon); }
.input-wrap input.err{ border-color:var(--error); }

.input-wrap select{
    width:100%; border:1.5px solid var(--border); border-radius:4px; outline:none; background:#fff; color:var(--ink);
    font-size:14px; font-family:inherit; padding:12px 14px; appearance:none; -webkit-appearance:none; -moz-appearance:none; cursor:pointer;
}
.input-wrap::after{ content:"▾"; font-size:12px; color:var(--ink-soft); position:absolute; right:15px; pointer-events:none; }
.input-wrap:has(input)::after{ display:none; }

.err-msg{ font-size:11.5px; color:var(--error); margin-top:5px; display:none; }
.err-msg.show{ display:block; }

.btn-main{ width:100%; padding:14px; background:var(--maroon); color:#fff; border:none; border-radius:4px; font-size:12.5px; font-weight:600; letter-spacing:1px; text-transform:uppercase; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px; margin-top:6px; }
.btn-main:hover{ background:var(--maroon-dark); }

.divider{ display:flex; align-items:center; gap:12px; margin:24px 0; font-size:10.5px; letter-spacing:1px; text-transform:uppercase; color:var(--ink-soft); }
.divider::before, .divider::after{ content:''; flex:1; height:1px; background:var(--border); }

.social-btn{ width:100%; padding:12px 16px; border:1px solid var(--border); border-radius:4px; background:#fff; display:flex; align-items:center; justify-content:center; gap:12px; cursor:pointer; font-size:13.5px; font-weight:500; margin-bottom:10px; }
.social-btn i{ font-size:16px; color:var(--ink-soft); width:20px; text-align:center; }
.social-btn:hover{ background:var(--bg); border-color:var(--maroon); }

.terms{ text-align:center; font-size:12px; color:var(--ink-soft); margin-top:22px; line-height:1.7; }

@media (max-width:992px){
    .card{ grid-template-columns:1fr; max-width:550px; }
    .visual{ min-height:230px; padding:30px; }
    .visual-bottom h2{ font-size:27px; }
}
@media (max-width:576px){
    body{ padding:10px; }
    .card{ border-radius:8px; }
    .visual{ display:none; }
    .form-side{ padding:26px 18px; }
    .tabs{ gap:20px; }
    .social-btn{ font-size:13px; }
}
</style>
</head>

<body>


<div class="card">
<div class="visual">
    <div class="visual-top">
        <div class="brand">
            VloMa
            <small>THE WOMEN'S EDIT</small>
        </div>
    </div>

    <div class="visual-bottom">
        <h2>Luxury Fashion For Every Woman</h2>
        <p>
            Discover timeless collections crafted with elegance,
            premium quality, and modern sophistication.
        </p>
    </div>
</div>

  <div class="form-side">
    <div class="tabs">
      <div class="tab active" id="tabLogin" onclick="switchTab('login')">Login</div>
      <div class="tab" id="tabCreate" onclick="switchTab('create')">Create</div>
    </div>

   <!-- LOGIN FORM -->
<form id="loginForm" action="{{ url_for('login') }}" method="POST">

    <!-- Remember where the user wanted to go -->
    <input
        type="hidden"
        name="next"
        value="{{ next_page or '' }}"
    >

    <div class="field">
        <label class="field-label">Email</label>

        <div class="input-wrap">
            <input
                type="email"
                id="loginEmail"
                name="email"
                placeholder="Enter your email"
                required>
        </div>

        <div class="err-msg" id="loginEmailErr">
            Enter a valid email.
        </div>
    </div>


    <div class="field">

        <label class="field-label">
            Password

            <a
                href="#"
                onclick="alert('Password reset link sent (demo).'); return false;"
            >
                Forgot?
            </a>
        </label>

        <div class="input-wrap">

            <input
                type="password"
                id="loginPassword"
                name="password"
                placeholder="Password"
                required>

            <button
                type="button"
                class="pw-toggle"
                onclick="togglePw('loginPassword', this)"
            >
                <i class="fa-solid fa-eye"></i>
            </button>

        </div>

        <div class="err-msg" id="loginPasswordErr">
            Incorrect email or password.
        </div>

    </div>


    <button type="submit" class="btn-main">
        Login →
    </button>

</form>

    <!-- CREATE FORM -->
<form id="createForm"
      action="{{ url_for('user_register') }}"
      method="POST"
      style="display:none;">

    <div class="field">
        <label class="field-label">First Name</label>
        <div class="input-wrap">
            <input type="text" id="createFirstName" name="first_name" placeholder="First Name" required>
        </div>
    </div>

    <div class="field">
        <label class="field-label">Last Name</label>
        <div class="input-wrap">
            <input type="text" id="createLastName" name="last_name" placeholder="Last Name" required>
        </div>
    </div>

    <div class="field">
        <label class="field-label">Email</label>
        <div class="input-wrap">
            <input type="email" id="createEmail" name="email" placeholder="you@domain.com" required>
        </div>
    </div>

    <div class="field">
        <label class="field-label">Password</label>
        <div class="input-wrap">
            <input
              type="password" 
              id="createPassword" 
              name="password" 
              placeholder="Minimum 6 characters"
              required>
            <button type="button" class="pw-toggle" onclick="togglePw('createPassword', this)">
                <i class="fa-solid fa-eye"></i>
            </button>
        </div>
    </div>

    <div class="field">
        <label class="field-label">Phone</label>
        <div class="input-wrap">
            <input type="tel" id="createPhone" name="phone" placeholder="Phone Number" required>
        </div>
    </div>

    <div class="field">
        <label class="field-label">Gender</label>
        <div class="input-wrap">
            <select id="createGender" name="gender" required>
                <option value="">Select Gender</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
            </select>
        </div>
    </div>

    <div class="field">
        <label class="field-label">Address</label>
        <div class="input-wrap">
            <input type="text" id="createAddress" name="address" placeholder="House No., Street, Area" required>
        </div>
    </div>

    <div class="field">
        <label class="field-label">Nearby Location / Landmark</label>
        <div class="input-wrap">
            <input type="text" id="createLandmark" name="landmark" placeholder="Nearby Landmark" required>
        </div>
    </div>

    <div class="field">
        <label class="field-label">Pincode</label>
        <div class="input-wrap">
            <input type="text" id="createPincode" name="pincode" placeholder="Pincode" required>
        </div>
    </div>

    <button type="submit" class="btn-main">Create Account →</button>

</form>

    <div id="loginExtras">
      <div class="divider">Or Connect With</div>
      <button class="social-btn" onclick="socialLogin('Google')"><i class="fa-brands fa-google"></i><span>Continue with Google</span></button>
      <button class="social-btn" onclick="socialLogin('Apple ID')"><i class="fa-brands fa-apple"></i><span>Continue with Apple</span></button>
      <button class="social-btn" onclick="socialLogin('Discord')"><i class="fa-brands fa-discord"></i><span>Continue with Discord</span></button>
    </div>

    <div class="terms">
      By connecting, you agree to our
      <a href="#">Terms</a> &amp;
      <a href="#">Privacy Policy</a>.
    </div>
  </div>
</div>

<script>
const THEME_KEY = 'anistock_theme';

function togglePw(id, btn){
  const input = document.getElementById(id);
  const icon = btn.querySelector('i');
  if (input.type === 'password') {
    input.type = 'text';
    if (icon) { icon.classList.remove('fa-eye'); icon.classList.add('fa-eye-slash'); }
  } else {
    input.type = 'password';
    if (icon) { icon.classList.remove('fa-eye-slash'); icon.classList.add('fa-eye'); }
  }
}

function switchTab(tab){
  const isLogin = tab === 'login';
  document.getElementById('tabLogin').classList.toggle('active', isLogin);
  document.getElementById('tabCreate').classList.toggle('active', !isLogin);
  document.getElementById('loginForm').style.display = isLogin ? '' : 'none';
  document.getElementById('createForm').style.display = isLogin ? 'none' : '';
  document.getElementById('loginExtras').style.display = isLogin ? '' : 'none';
}

/* ===== Settings / 3-dot menu ===== */
const SETTINGS_ICONS = {
  profile: '<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>',
  address: '<svg viewBox="0 0 24 24"><path d="M12 21s7-7.5 7-12a7 7 0 1 0-14 0c0 4.5 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/></svg>',
  orders: '<svg viewBox="0 0 24 24"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg>',
  language: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a15 15 0 0 1 0 18"/><path d="M12 3a15 15 0 0 0 0 18"/></svg>'
};

const SETTINGS_DATA = [
  { title: 'Account', icon: SETTINGS_ICONS.profile, items: [
      { name: 'My Profile' },
      { name: 'Edit Profile', children: ['Change Profile Picture','Change Username','Change Email','Change Phone Number','Change Password'] },
      { name: 'Delete Account', danger: true },
      { name: 'Logout', danger: true }
  ]},
  { title: 'Address Management', icon: SETTINGS_ICONS.address, items: [
      { name: 'Add New Address' },
      { name: 'Edit Address' },
      { name: 'Delete Address' },
      { name: 'View Saved Addresses' }
  ]},
  { title: 'Orders', icon: SETTINGS_ICONS.orders, items: [
      { name: 'My Orders' },
      { name: 'Track Order' },
      { name: 'Order History', children: ['Buy Again','Return / Refund / Replace Item'] }
  ]},
  { title: 'Preferences', icon: SETTINGS_ICONS.language, items: [
      { name: 'Dark Mode / Light Mode', toggle: true },
      { name: 'Language' }
  ]}
];

function renderSettings(){
  const body = document.getElementById('settingsBody');
  body.innerHTML = SETTINGS_DATA.map((sec, i) => `
    <div class="settings-section" id="sec-${i}">
      <div class="settings-section-head" onclick="toggleSection(${i})">
        <span class="settings-section-title"><span class="settings-icon">${sec.icon}</span>${sec.title}</span><span class="chev">▾</span>
      </div>
      <div class="settings-section-items">
        ${sec.items.map((item, j) => renderSettingsItem(item, i, j)).join('')}
      </div>
    </div>
  `).join('');
  syncThemeToggle();
}

function renderSettingsItem(item, i, j){
  if (item.children && item.children.length) {
    const subId = `sub-${i}-${j}`;
    return `
      <div class="settings-item-row" onclick="toggleSubSection('${subId}', event)">
        <span>${item.name}</span><span class="settings-chevron-small" id="chev-${subId}">▾</span>
      </div>
      <div class="settings-subsection" id="${subId}">
        ${item.children.map(child => `
          <div class="settings-item-row settings-subitem" onclick="handleSettingsAction('${item.name.replace(/'/g,"")}','${child.replace(/'/g,"")}', event)">
            <span>${child}</span><span class="settings-chevron-small">›</span>
          </div>`).join('')}
      </div>`;
  }
  return `<div class="settings-item-row ${item.danger ? 'settings-danger' : ''}" onclick="handleSettingsAction('','${item.name.replace(/'/g,"")}', event)">
    <span>${item.name}</span>
    ${item.toggle
      ? `<span class="settings-toggle" id="themeToggle" onclick="toggleSwitch(this, event)"></span>`
      : `<span class="settings-chevron-small">›</span>`}
  </div>`;
}

function toggleSection(i){ document.getElementById('sec-' + i).classList.toggle('open'); }

function toggleSubSection(id, e){
  e.stopPropagation();
  document.getElementById(id).classList.toggle('open');
  const chev = document.getElementById('chev-' + id);
  if (chev) chev.classList.toggle('rotated');
}

function syncThemeToggle(){
  const t = document.getElementById('themeToggle');
  if (t && document.body.classList.contains('dark-mode')) t.classList.add('on');
}

function applyTheme(mode){
  document.body.classList.toggle('dark-mode', mode === 'dark');
  localStorage.setItem(THEME_KEY, mode);
}

function toggleSwitch(el, e){
  e.stopPropagation();
  el.classList.toggle('on');
  if (el.id === 'themeToggle') {
    applyTheme(el.classList.contains('on') ? 'dark' : 'light');
  }
}

function handleSettingsAction(section, item, e){
  if (e && e.target.classList.contains('settings-toggle')) return;
if (item === 'Logout') {
    localStorage.removeItem('anistock_user');
    window.location.href = "{{ url_for('logout') }}";
    return;
}
  if (item === 'Delete Account') {
    if (confirm('Are you sure you want to delete your account? This action cannot be undone.')) {
      closeSettings();
    }
    return;
  }
  closeSettings();
}

function openSettings(e){ if (e) e.preventDefault(); renderSettings(); document.getElementById('settingsOverlay').classList.add('show'); }
function closeSettings(){ document.getElementById('settingsOverlay').classList.remove('show'); }
function closeSettingsOnOverlay(e){ if (e.target.id === 'settingsOverlay') closeSettings(); }

(function initTheme(){
  if (localStorage.getItem(THEME_KEY) === 'dark') document.body.classList.add('dark-mode');
})();
</script>
</body>
</html>
